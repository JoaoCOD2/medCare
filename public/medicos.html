<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encontrar médico | MedCare</title>
  <meta name="description" content="Encontre médicos por especialidade, veja horários disponíveis e agende sua consulta de forma rápida e segura.">
  <meta name="theme-color" content="#15915F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='13' fill='%2315915F'/%3E%3Cpath d='M17 9h6a2 2 0 0 1 2 2v4h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4v4a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-4h-4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h4v-4a2 2 0 0 1 2-2Z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-pagina="medicos">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<div data-include="components/header.html"></div>

<main id="conteudo">
<section class="pagina-topo">
  <div class="container">
    <nav aria-label="Você está em"><ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="index.html">Início</a></li>
      <li class="breadcrumb-item active" aria-current="page">Encontrar médico</li>
    </ol></nav>
    <h1>Encontrar médico</h1>
    <p class="text-muted-mc mb-4">Filtre por especialidade, local, modalidade e data.</p>

    <form class="filtros" id="form-busca" method="get" action="medicos.html" role="search">
      <div class="row g-3">
        <div class="col-md-6 col-lg-3">
          <label class="form-label" for="f-q">Nome do médico</label>
          <input class="form-control" id="f-q" name="q" placeholder="Ex.: Carlos Almeida">
        </div>
        <div class="col-md-6 col-lg-3">
          <label class="form-label" for="f-esp">Especialidade</label>
          <select class="form-select" id="f-esp" name="especialidade"><option value="">Todas</option></select>
        </div>
        <div class="col-md-6 col-lg-2">
          <label class="form-label" for="f-cidade">Cidade</label>
          <input class="form-control" id="f-cidade" name="cidade" list="cidades" placeholder="Todas">
          <datalist id="cidades"></datalist>
        </div>
        <div class="col-md-6 col-lg-2">
          <label class="form-label" for="f-bairro">Bairro</label>
          <input class="form-control" id="f-bairro" name="bairro" placeholder="Todos">
        </div>
        <div class="col-md-6 col-lg-2">
          <label class="form-label" for="f-atend">Atendimento</label>
          <select class="form-select" id="f-atend" name="atendimento">
            <option value="">Presencial ou online</option>
            <option value="presencial">Presencial</option>
            <option value="online">Online</option>
          </select>
        </div>
        <div class="col-md-6 col-lg-3">
          <label class="form-label" for="f-data">Data disponível</label>
          <input class="form-control" type="date" id="f-data" name="data">
        </div>
        <div class="col-lg-9 d-flex align-items-end gap-2 flex-wrap">
          <button class="btn btn-mc px-4" type="submit"><i class="fa-solid fa-magnifying-glass me-2"></i>Buscar</button>
          <a class="btn btn-ghost" id="limpar" href="medicos.html" hidden>Limpar filtros</a>
        </div>
      </div>
    </form>
  </div>
</section>

<section class="secao pt-4" aria-live="polite">
  <div class="container">
    <p class="text-muted-mc mb-4" id="contador">Carregando…</p>
    <div class="row g-4" id="resultados"></div>
    <div class="vazio" id="vazio" hidden>
      <i class="fa-regular fa-face-frown-open" aria-hidden="true"></i>
      <h2 class="h4">Nenhum médico encontrado</h2>
      <p>Tente remover algum filtro, buscar outra data ou ampliar a cidade.</p>
      <a class="btn btn-mc" href="medicos.html">Limpar filtros</a>
    </div>
  </div>
</section>
</main>

<div data-include="components/footer.html"></div>
<div data-include="components/templates.html"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/medicos.js"></script>
</body>
</html>

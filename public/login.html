<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | MedCare</title>
  <meta name="description" content="Encontre médicos por especialidade, veja horários disponíveis e agende sua consulta de forma rápida e segura.">
  <meta name="theme-color" content="#15915F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='13' fill='%2315915F'/%3E%3Cpath d='M17 9h6a2 2 0 0 1 2 2v4h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4v4a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-4h-4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h4v-4a2 2 0 0 1 2-2Z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-pagina="">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<div data-include="components/header.html"></div>

<main id="conteudo">
<section class="secao pt-4">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Entrar</h1>
        <p class="text-muted-mc">Acesse sua conta para agendar e acompanhar consultas.</p>
        <form id="form-login" data-fase="Autenticação real (password_verify + sessão) chega na Fase 4." novalidate>
          <div class="mb-3">
            <label class="form-label" for="identificador">CPF ou e-mail</label>
            <input class="form-control" id="identificador" name="identificador" autocomplete="username" required>
            <div class="invalid-feedback">Informe seu CPF ou e-mail.</div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" id="senha" name="senha" autocomplete="current-password" required minlength="8">
            <div class="invalid-feedback">A senha deve ter ao menos 8 caracteres.</div>
          </div>
          <div class="mb-4"><a href="#" class="small" data-fase-link="Recuperação de senha chega na Fase 4.">Esqueci minha senha</a></div>
          <button class="btn btn-mc w-100 btn-lg" type="submit">Entrar</button>
          <a class="btn btn-mc-outline w-100 mt-2" href="cadastro.html">Criar conta</a>
        </form>
      </div>
    </div>
  </div>
</section>
</main>

<div data-include="components/footer.html"></div>
<div data-include="components/templates.html"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/forms.js"></script>
</body>
</html>
